<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务面板原型 v2 · 统一形态：详情 / 会话历史 / 引用到主会话</title>
<style>
:root, body[data-theme="light"] {
  --bg: #F5F1E8; --surface: #FBF9F3; --sidebar: #EFE9DC; --rail: #EBE4D4;
  --text: #33302B; --muted: #8A8272; --border: #E0D8C6; --border-soft: #EAE3D3;
  --accent: #10B981; --accent-soft: rgba(16,185,129,.12);
  --red: #EF4444; --red-soft: rgba(239,68,68,.10);
  --amber: #D97706; --amber-soft: rgba(217,119,6,.12);
  --code-bg: #EDE7D8; --hover: rgba(51,48,43,.05);
  --user-bubble: #E7E0CE; --tool-bg: #EFEADB;
}
body[data-theme="dark"] {
  --bg: #1E242C; --surface: #232A33; --sidebar: #1A2027; --rail: #171D24;
  --text: #C6CBD2; --muted: #737D89; --border: #2E3742; --border-soft: #28313B;
  --accent: #10B981; --accent-soft: rgba(16,185,129,.15);
  --red: #EF4444; --red-soft: rgba(239,68,68,.14);
  --amber: #E8A33D; --amber-soft: rgba(232,163,61,.14);
  --code-bg: #1A222B; --hover: rgba(198,203,210,.06);
  --user-bubble: #2B333E; --tool-bg: #212933;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; }

.topbar { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar .title { font-weight: 600; font-size: 12.5px; }
.topbar .searchbox { flex: 1; max-width: 340px; margin: 0 auto; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 12px; }
.wco { display: flex; gap: 14px; margin-left: auto; color: var(--muted); font-size: 12px; user-select: none; }
.wco span { cursor: default; width: 14px; text-align: center; }
.traffic { display: flex; gap: 8px; }
.traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic .r { background: #FF5F57; } .traffic .y { background: #FEBC2E; } .traffic .g { background: #28C840; }

.main { flex: 1; display: flex; min-height: 0; }
.rail { width: 48px; background: var(--rail); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 6px 0 8px; gap: 2px; flex-shrink: 0; }
.rail button { position: relative; width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: all .12s; }
.rail button:hover { background: var(--hover); color: var(--text); }
.rail button.active { background: var(--accent-soft); color: var(--accent); }
.rail button.active::before { content: ''; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.rail button .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--rail); }
.rail .spacer { flex: 1; }
svg { display: block; }

.taskpanel { flex: 1; display: flex; min-width: 0; }
.tp-left { width: 300px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--sidebar); display: flex; flex-direction: column; min-height: 0; }
.tp-left-head { padding: 10px 12px 6px; display: flex; align-items: center; justify-content: space-between; }
.tp-left-head .h { font-weight: 700; font-size: 14px; }
.tp-scroll { flex: 1; overflow-y: auto; padding: 2px 6px 20px; }
.sec-head { display: flex; align-items: center; gap: 6px; padding: 10px 8px 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .05em; }
.sec-head .cnt { background: var(--hover); border-radius: 8px; padding: 0 6px; font-size: 10px; }
.sec-head .add { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
.sec-head .add:hover { background: var(--accent-soft); }
.trow { border-radius: 8px; margin: 1px 2px; }
.trow:hover { background: var(--hover); }
.trow.selected { background: var(--accent-soft); }
.trow-main { display: flex; align-items: center; gap: 8px; padding: 7px 8px; cursor: pointer; }
.trow-main .nm { flex: 1; min-width: 0; }
.trow-main .nm .t { font-weight: 550; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.trow-main .nm .d { color: var(--muted); font-size: 11px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600; flex-shrink: 0; }
.badge.new { background: var(--accent); color: #fff; }
.badge.run { background: var(--accent-soft); color: var(--accent); }
.badge.review { background: var(--amber-soft); color: var(--amber); }
.switch { width: 26px; height: 15px; border-radius: 8px; background: var(--accent); position: relative; flex-shrink: 0; cursor: pointer; }
.switch::after { content: ''; position: absolute; top: 1.5px; right: 1.5px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
.switch.off { background: var(--border); }
.switch.off::after { right: 12.5px; }
.runs { display: none; padding: 0 4px 4px 26px; }
.runs.open { display: block; }
.runrow { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 6px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
.runrow:hover { background: var(--hover); }
.runrow.selected { background: var(--accent-soft); color: var(--text); }
.runrow .st-ok { color: var(--accent); } .runrow .st-err { color: var(--red); }
.runrow .tk { margin-left: auto; font-size: 10px; }
.chev { transition: transform .15s; color: var(--muted); flex-shrink: 0; display: grid; place-items: center; }
.chev.open { transform: rotate(90deg); }
.spin { width: 12px; height: 12px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; flex-shrink: 0; }
@keyframes rot { to { transform: rotate(360deg); } }
.collapse-hint { display: flex; align-items: center; gap: 6px; padding: 5px 10px; color: var(--muted); font-size: 11px; cursor: pointer; }
.urlinput { display: flex; align-items: center; gap: 6px; margin: 3px 6px; padding: 5px 8px; border: 1px solid var(--accent); border-radius: 7px; background: var(--surface); }
.urlinput input { flex: 1; border: none; background: none; color: var(--text); font-size: 11.5px; outline: none; min-width: 0; }

.tp-right { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); }
.detail-head { padding: 14px 20px 10px; border-bottom: 1px solid var(--border-soft); }
.detail-head .t { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.detail-head .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.kv { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.kv .chip { border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 11.5px; color: var(--muted); background: var(--bg); }
.kv .chip b { color: var(--text); font-weight: 600; }
.detail-body { flex: 1; overflow-y: auto; padding: 14px 20px; }
.promptbox { border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); padding: 10px 12px; font-size: 12px; line-height: 1.7; color: var(--muted); white-space: pre-wrap; max-height: 140px; overflow: hidden; position: relative; }
.promptbox::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 46px; background: linear-gradient(transparent, var(--code-bg)); }
.detail-actions { display: flex; gap: 8px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 5px 12px; font-size: 12px; cursor: pointer; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { opacity: .9; }
.iterate-hint { margin-top: 18px; border: 1px dashed var(--border); border-radius: 9px; padding: 10px 12px; font-size: 11.5px; color: var(--muted); line-height: 1.8; }
.iterate-hint b { color: var(--text); }

.chatwrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.runmeta { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border-soft); font-size: 11.5px; color: var(--muted); background: var(--bg); }
.runmeta b { color: var(--text); }
.runmeta .to-main { margin-left: auto; }
.chatscroll { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.msg-user { align-self: flex-end; max-width: 78%; background: var(--user-bubble); border-radius: 12px 12px 3px 12px; padding: 9px 12px; font-size: 12.5px; line-height: 1.65; }
.msg-ai { max-width: 92%; display: flex; flex-direction: column; gap: 8px; }
.msg-ai .who { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.msg-ai .txt { font-size: 12.5px; line-height: 1.7; }
.toolcall { border: 1px solid var(--border); border-left: 3px solid var(--muted); background: var(--tool-bg); border-radius: 7px; padding: 7px 10px; font-size: 11.5px; color: var(--muted); font-family: "Cascadia Code", Consolas, monospace; }
.toolcall b { color: var(--text); font-weight: 600; }
.toolcall.ok { border-left-color: var(--accent); }
.thinking { display: inline-flex; gap: 4px; align-items: center; }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

.basepanel { flex: 1; display: flex; min-width: 0; }
.base-left { width: 280px; border-right: 1px solid var(--border); background: var(--sidebar); overflow-y: auto; padding: 6px; }
.base-note-row { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
.base-note-row:hover { background: var(--hover); }
.base-note-row .t { font-weight: 550; }
.base-note-row .d { color: var(--muted); font-size: 11px; margin-top: 2px; }
.dc-tabs { display: flex; gap: 2px; padding: 8px 14px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; background: var(--surface); }
.dc-tabs .t { padding: 7px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
.dc-tabs .t.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.dc-body { flex: 1; overflow-y: auto; padding: 14px 18px; }
.demo-chips { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 40; }
.demo-chips button { font-size: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 14px; padding: 3px 10px; cursor: pointer; }
.demo-chips button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.convlist { width: 256px; border-right: 1px solid var(--border); background: var(--sidebar); overflow-y: auto; padding: 8px 6px; }
.conv-grp .gt { padding: 6px 10px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.conv-row { padding: 7px 10px 7px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.conv-row:hover { background: var(--hover); }
.conv-row .exec-tag { font-size: 10px; color: var(--amber); background: var(--amber-soft); border-radius: 6px; padding: 1px 6px; font-weight: 600; }
.conv-empty-note { margin: 14px; padding: 10px 12px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 11.5px; line-height: 1.7; }

.draftwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--surface); }
.draft-main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.refcard { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; max-width: 560px; }
.refcard .ic { color: var(--accent); }
.refcard .tt { flex: 1; min-width: 0; }
.refcard .tt .a { font-weight: 650; font-size: 12.5px; }
.refcard .tt .b { color: var(--muted); font-size: 11px; margin-top: 1px; }
.refcard .x { color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; }
.draft-input { border-top: 1px solid var(--border); padding: 12px 18px 16px; }
.draft-input .box { max-width: 720px; margin: 0 auto; border: 1.5px solid var(--accent); border-radius: 12px; background: var(--bg); padding: 12px 14px; }
.draft-input textarea { width: 100%; border: none; background: none; color: var(--text); font-size: 13px; outline: none; resize: none; font-family: inherit; line-height: 1.6; }
.draft-input .hint { max-width: 720px; margin: 8px auto 0; color: var(--muted); font-size: 11px; text-align: center; }
.draft-reply { max-width: 720px; align-self: flex-start; }
.draft-reply .who { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.draft-reply .txt { font-size: 12.5px; line-height: 1.75; border-left: 3px solid var(--accent); padding-left: 12px; }

#ctrl { position: fixed; right: 14px; bottom: 14px; z-index: 99; }
#ctrl-btn { background: #2D3748; color: #A0AEC0; border: 1px solid #4A5568; border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
#ctrl-panel { display: none; width: 250px; background: #2D3748; color: #CBD5E0; border: 1px solid #4A5568; border-radius: 10px; padding: 12px 14px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
#ctrl.open #ctrl-panel { display: block; }
#ctrl h5 { color: #E2E8F0; font-size: 11px; margin: 8px 0 4px; letter-spacing: .05em; }
#ctrl .seg { display: flex; gap: 4px; margin: 3px 0; }
#ctrl .seg button { flex: 1; font-size: 11px; border: 1px solid #4A5568; background: #374151; color: #CBD5E0; border-radius: 6px; padding: 4px 0; cursor: pointer; }
#ctrl .seg button.on { background: #10B981; border-color: #10B981; color: #fff; }
#ctrl .note { color: #718096; font-size: 10.5px; line-height: 1.5; margin-top: 6px; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
.toast { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); background: #2D3748; color: #E2E8F0; font-size: 12px; border-radius: 8px; padding: 8px 16px; z-index: 98; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body data-theme="light">
<div id="app">
  <div class="topbar">
    <span id="platform-left" style="display:flex;align-items:center"></span>
    <span class="title">Dogear</span>
    <div class="searchbox"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span id="search-hint">搜索任务与运行记录…</span></div>
    <div id="platform-right"></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>

<div id="ctrl">
  <button id="ctrl-btn">⚙ 原型控制</button>
  <div id="ctrl-panel">
    <h5>视图</h5>
    <div class="seg" id="seg-variant">
      <button data-v="panel" class="on">任务面板（方案）</button>
      <button data-v="baseline">现状基线</button>
    </div>
    <h5>主题 / 平台</h5>
    <div class="seg" id="seg-theme"><button data-v="light" class="on">浅色</button><button data-v="dark">深色</button></div>
    <div class="seg" id="seg-platform"><button data-v="win" class="on">Windows</button><button data-v="mac">macOS</button></div>

    <div class="note">统一形态：点任务=详情，点会话=只读历史，迭代=引用到主会话。点 rail「对话」验证执行会话可见性。</div>
  </div>
</div>

<script>

const ico = {

  document.getElementById('search-hint').textContent =
    state.view === 'panel' ? '搜索任务与运行记录…' : state.view === 'chat' ? '搜索当前会话内容…' : state.view === 'draft' ? '对话内搜索（Ctrl+F）…' : '搜索当前页面内容…';

  let railActive = state.view === 'chat' || state.view === 'draft' ? 'chat' : state.view === 'panel' ? 'panel' : 'notes';
  let content = '';
  if (state.variant === 'baseline') { railActive = 'notes'; content = baselineView(); }
  else if (state.view === 'chat') content = convListView();
  else if (state.view === 'draft') content = draftView();
  else content = `<div class="taskpanel">${leftPanel()}<div class="tp-right">${panelRight()}</div></div>`;
  document.getElementById('main').innerHTML = rail(railActive) + `<div style="flex:1;display:flex;min-width:0;position:relative">${content}</div>`;
  bind();
}

function bind() {

    else if (id === 'notes' || id === 'dc') { if (state.variant === 'baseline') { state.view = 'panel'; state.baselineScreen = id === 'notes' ? 'notes' : 'dc'; } else showToast('demo 只实现了任务面板 / 对话 / 草稿'); }
    render();
  });
  document.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => { state.baselineScreen = b.dataset.bs; render(); });
  document.querySelectorAll('[data-toggle]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    state.expanded = state.expanded === el.dataset.toggle ? null : el.dataset.toggle;
    state.selected = 'task-' + el.dataset.toggle;
    render();
  });
  document.querySelectorAll('[data-taskname]').forEach(el => el.onclick = e => { e.stopPropagation(); state.selected = 'task-' + el.dataset.taskname; render(); });
  document.querySelectorAll('[data-switch]').forEach(el => el.onclick = e => { e.stopPropagation(); el.classList.toggle('off'); });
  document.querySelectorAll('[data-run]').forEach(el => el.onclick = e => { e.stopPropagation(); state.selected = el.dataset.run; render(); });
  document.querySelectorAll('[data-toast]').forEach(el => el.onclick = () => showToast(el.dataset.toast));
  document.querySelectorAll('[data-tomain]').forEach(el => el.onclick = () => { state.draftRef = el.dataset.tomain; state.view = 'draft'; render(); });
  const xref = document.querySelector('[data-xref]');
  if (xref) xref.onclick = () => { state.draftRef = null; state.view = 'panel'; render(); };
  const pa = document.getElementById('parse-add');
  if (pa) pa.onclick = e => { e.stopPropagation(); state.parseOpen = !state.parseOpen; render(); const i = document.getElementById('parse-url'); if (i) i.focus(); };
  const pu = document.getElementById('parse-url');
  if (pu) pu.onkeydown = e => { if (e.key === 'Enter' && pu.value.trim()) { showToast('已加入解析队列，完成后落入工作区文章文件夹（demo）'); state.parseOpen = false; render(); } };
  const ta = document.getElementById('draft-ta');
  if (ta) {
    ta.focus();
    ta.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey && ta.value.trim()) {
        e.preventDefault();
        const v = ta.value.trim(); ta.value = '';
        const m = document.getElementById('draft-main');
        m.insertAdjacentHTML('beforeend', `<div class="msg-user" style="align-self:flex-end;max-width:560px">${v.replace(/</g, '&lt;')}</div>`);
        m.insertAdjacentHTML('beforeend', `<div class="draft-reply"><div class="who">回复</div><div class="txt"><span class="thinking"><i></i><i></i><i></i></span></div></div>`);
        m.scrollTop = m.scrollHeight;
        setTimeout(() => {
          const t = m.querySelector('.draft-reply:last-child .txt');
          if (t) t.innerHTML = '（demo）已读取该次运行会话：第 1 轮 Grep 范围排除了 docs/，所以 TODO 只统计了 src/electron——要纳入 docs 的话，我建议把任务提示词 §1 的扫描范围改为全仓，需要的话我直接帮你改任务定义。';
          m.scrollTop = m.scrollHeight;
        }, 1100);
      }
    };
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('ctrl-btn').onclick = () => document.getElementById('ctrl').classList.toggle('open');
function seg(id, key, cb) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.remove('on'));
    b.classList.add('on'); state[key] = b.dataset.v; if (cb) cb(); render();
  });
}
seg('seg-variant', 'variant', () => { state.view = 'panel'; });
seg('seg-theme', 'theme');
seg('seg-platform', 'platform');
seg('seg-exec', 'exec');
render();
</script>
</body>
</html>
