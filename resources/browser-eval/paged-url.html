<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>URL 翻页评测：多页文章</title>
</head>
<body>
<article>
  <h1>URL 翻页评测文章</h1>
  <div id="page-body"></div>
</article>
<nav><a id="next-link" href="?page=2">下一页</a></nav>
<script>
const PARA = '本段为浏览器评测固定文本，用于统计正文字数与验证内容提取，请忽略语义。';
const buildPage = (paras, mark) => {
  const parts = ['<p>页内标记：DOGEAR-EVAL-MARK-PAGEDURL-' + mark + '。</p>'];
  for (let i = 0; i < paras; i++) {
    parts.push('<p>第 ' + mark + ' 页内容。' + PARA + '</p>');
  }
  return parts.join('');
};
const PAGES = [buildPage(7, 1), buildPage(11, 2), buildPage(9, 3)];
const params = new URLSearchParams(location.search);
const requested = parseInt(params.get('page') || '1', 10);
const current = Number.isFinite(requested) ? Math.min(Math.max(requested, 1), PAGES.length) : 1;
document.getElementById('page-body').innerHTML = PAGES[current - 1];
const link = document.getElementById('next-link');
if (current >= PAGES.length) {
  link.style.display = 'none';
} else {
  link.setAttribute('href', '?page=' + (current + 1));
}
</script>
</body>
</html>
