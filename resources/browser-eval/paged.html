<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>翻页评测：多页文章</title>
</head>
<body>
<article>
  <h1>翻页评测文章</h1>
  <div id="page-body"></div>
</article>
<nav><button id="next-btn" type="button">下一页</button></nav>
<script>
const PARA = '本段为浏览器评测固定文本，用于统计正文字数与验证内容提取，请忽略语义。';
const buildPage = (paras, mark) => {
  const parts = ['<p>页内标记：DOGEAR-EVAL-MARK-PAGED-' + mark + '。</p>'];
  for (let i = 0; i < paras; i++) {
    parts.push('<p>第 ' + mark + ' 页内容。' + PARA + '</p>');
  }
  return parts.join('');
};
const PAGES = [buildPage(6, 1), buildPage(12, 2), buildPage(8, 3)];
let current = 0;
function render() {
  document.getElementById('page-body').innerHTML = PAGES[current];
  document.getElementById('next-btn').style.display =
    current >= PAGES.length - 1 ? 'none' : '';
}
document.getElementById('next-btn').addEventListener('click', () => {
  if (current < PAGES.length - 1) {
    current++;
    render();
  }
});
render();
</script>
</body>
</html>
