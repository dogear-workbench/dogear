<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>折叠正文评测：展开全文</title>
</head>
<body>
<article>
  <h1>折叠正文评测文章</h1>
  <p id="summary">这是折叠文章的摘要，仅展示开头一小段内容，完整正文需要点击展开全文按钮后才能查看。</p>
  <div id="full" style="display:none"></div>
  <button id="expand-btn" type="button">展开全文</button>
</article>
<script>
const PARA = '本段为浏览器评测固定文本，用于统计正文字数与验证内容提取，请忽略语义。';
const parts = ['<p>起始标记：DOGEAR-EVAL-MARK-COLLAPSED-1。</p>'];
for (let i = 0; i < 15; i++) {
  parts.push('<p>' + PARA + '</p>');
}
parts.push('<p>深度标记：DOGEAR-EVAL-MARK-COLLAPSED-2，全文至此结束。</p>');
document.getElementById('full').innerHTML = parts.join('');
document.getElementById('expand-btn').addEventListener('click', () => {
  document.getElementById('full').style.display = 'block';
  document.getElementById('expand-btn').style.display = 'none';
});
</script>
</body>
</html>
