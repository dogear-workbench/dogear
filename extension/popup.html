<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1f2937;
    }
    button {
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: default; }
    #status {
      margin-top: 12px;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-line;
    }
    .ok { color: #059669; }
    .err { color: #dc2626; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <button id="connect">连接此标签页</button>
  <div id="status" class="muted">未连接</div>
  <script src="popup.js"></script>
</body>
</html>
