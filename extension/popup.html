<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1f2937;
    }
    button {
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: default; }
    #status {
      margin-top: 12px;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-line;
    }
    .ok { color: #059669; }
    .err { color: #dc2626; }
    .muted { color: #6b7280; }
    #perm {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
      line-height: 1.6;
    }
    .perm-origin {
      font-weight: 600;
      color: #374151;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .perm-granted { color: #059669; }
    button.secondary {
      background: #e5e7eb;
      color: #374151;
    }
    button.secondary:hover { background: #d1d5db; }
    button.secondary:disabled { background: #f3f4f6; color: #9ca3af; }
  </style>
</head>
<body>
  <button id="connect">把当前页交给 Dogear</button>
  <button id="disconnect" class="secondary" hidden>断开连接</button>
  <button id="handoff" class="secondary">发送当前页到 Dogear</button>
  <div id="status" class="muted">未连接</div>
  <div id="perm" class="muted">授权状态读取中…</div>
  <script src="popup.js"></script>
</body>
</html>
